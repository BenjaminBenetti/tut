<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Armoured variants lineup</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #171613;
        color: #e7dfd0;
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1800px;
        margin: auto;
        padding: 32px 40px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 30px;
        align-items: end;
        margin-bottom: 20px;
      }
      .eyebrow {
        color: #c6a275;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-size: 11px;
        font-weight: 600;
      }
      h1 {
        font:
          48px/1.1 Georgia,
          serif;
        margin: 10px 0;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: #aca798;
      }
      nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        padding: 14px 0;
        border-top: 1px solid #39342b;
      }
      select {
        color: #e7dfd0;
        background: #29261f;
        border: 1px solid #554938;
        padding: 8px 12px;
        border-radius: 4px;
        font: inherit;
      }
      label {
        color: #c6bca9;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #status {
        margin-left: auto;
        font-size: 12px;
      }
      .lineup {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      article {
        background: #211f1a;
        border: 1px solid #39342b;
        border-radius: 6px;
        overflow: hidden;
      }
      .viewport {
        height: 320px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .caption {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 16px 20px;
        border-top: 1px solid #39342b;
      }
      h2 {
        font:
          22px Georgia,
          serif;
        margin: 4px 0;
      }
      .stats {
        font-size: 11px;
        color: #a28e70;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 1100px) {
        .lineup {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @media (max-width: 580px) {
        main {
          padding: 16px;
        }
        header {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">Terra Under Threat · Act III bestiary</div>
          <h1>The armoured variants</h1>
          <p>
            Each base species on the left, its armoured variant on the right, at
            one camera scale.
          </p>
        </div>
      </header>
      <nav aria-label="Lineup controls">
        <label
          >Pose
          <select id="pose">
            <option value="rest">Rest</option>
            <option value="walk">Walk</option>
            <option value="strike">Strike</option>
          </select></label
        >
        <label
          >Angle
          <input id="angle" type="range" min="0" max="360" step="1" value="45"
        /></label>
        <p id="status" role="status">Loading models…</p>
      </nav>
      <section class="lineup" aria-label="Base species and armoured variants">
        <article data-base="swarmer" data-variant="swarmer-armoured">
          <div
            class="viewport"
            role="img"
            aria-label="Swarmer beside the armoured swarmer"
          ></div>
          <div class="caption"></div>
        </article>
        <article data-base="lurker" data-variant="lurker-armoured">
          <div
            class="viewport"
            role="img"
            aria-label="Lurker beside the armoured lurker"
          ></div>
          <div class="caption"></div>
        </article>
        <article data-base="brute" data-variant="brute-armoured">
          <div
            class="viewport"
            role="img"
            aria-label="Brute beside the armoured brute"
          ></div>
          <div class="caption"></div>
        </article>
      </section>
    </main>
    <script type="module" src="./armoured-bugs.ts"></script>
  </body>
</html>
