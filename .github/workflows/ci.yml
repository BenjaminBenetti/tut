name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR supersedes its run. Pushes to main must not:
# with a merge every few minutes, main never reached a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

# Only the fast checks run here. The seeded mission sweep (`pnpm test:sim`)
# and the Playwright suite (`pnpm test:e2e`) render or play whole missions
# and took five to twenty-five minutes on a shared runner, where the
# sweep's own time budget failed on runner speed alone (#1159, Executive
# Director, 2026-09-16). Both remain local gates: run them before a PR.
jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
