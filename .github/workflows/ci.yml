name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR supersedes its run. Pushes to main must not:
# with a merge every few minutes, main never reached a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

# Only the fast checks run here. The seeded mission sweep (`pnpm test:sim`)
# and the Playwright suite (`pnpm test:e2e`) render or play whole missions
# and took five to twenty-five minutes on a shared runner, where the
# sweep's own time budget failed on runner speed alone (#1159, Executive
# Director, 2026-09-16). Both remain local gates: run them before a PR.
jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:relay
      - run: pnpm build
  relay-container:
    name: relay container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f relay/Dockerfile -t tut-jev-relay:test .
      - name: Check runtime health without an upstream request
        run: |
          docker run -d --name jev-relay -p 8081:8081 -e PORT=8081 -e JevKey=container-smoke-test tut-jev-relay:test
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 20 --max-time 3 http://localhost:8081/health
          docker exec jev-relay node -e "if(process.getuid()===0)process.exit(1)"
          docker exec jev-relay node -e "fetch('http://localhost:8081/v1/systemone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'jev-latest',state:'Unrelated task',questions:{other:{type:'choice',instructions:'Choose',criteria:{yes:'Yes',no:'No'}}}})}).then(r=>process.exit(r.status===400?0:1)).catch(()=>process.exit(1))"
      - name: Container logs
        if: always()
        run: docker logs jev-relay
