name: Release

# Pushing a tag like v0.1.3 builds the game, publishes a GitHub Release with
# the built dist/ attached, and deploys the same build to GitHub Pages.
# See docs/process/releasing.md.
#
#   git tag v0.1.3 && git push origin v0.1.3
#          │
#          ▼
#      verify ──┬──► release   (GitHub Release + zip)
#               └──► deploy    (GitHub Pages)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  # Pages serves the site under /<repo>/, so assets and icon URLs need this base.
  TUT_BASE_PATH: /tut/

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Zip dist
        run: (cd dist && zip -qr "../tut-${GITHUB_REF_NAME}.zip" .)
      - name: Upload release zip
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: tut-*.zip
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  release:
    name: GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release zip
        uses: actions/download-artifact@v8
        with:
          name: release-zip
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber tut-*.zip
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes tut-*.zip
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
